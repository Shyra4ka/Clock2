name: Build mod

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORGE_VERSION: 1.20.1-47.3.0
  MOD_ID: timestopclock

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Show repository files
        run: find . -path ./.git -prune -o -type f -print | head -60

      - name: Download Forge MDK
        run: |
          curl -fsSL -o /tmp/mdk.zip "https://maven.minecraftforge.net/net/minecraftforge/forge/${FORGE_VERSION}/forge-${FORGE_VERSION}-mdk.zip"
          mkdir -p /tmp/mdk
          unzip -q /tmp/mdk.zip -d /tmp/mdk
          MDK_DIR=$(dirname "$(find /tmp/mdk -name gradlew | head -1)")
          echo "MDK_DIR=$MDK_DIR" >> "$GITHUB_ENV"
          echo "MDK found in: $MDK_DIR"
          ls "$MDK_DIR"

      - name: Insert mod sources into MDK
        run: |
          # Если исходники загружены архивом .zip - распаковываем его
          for z in $(find . -path ./.git -prune -o -type f -name '*.zip' -print); do
            echo "Unpacking $z"
            unzip -q -o "$z" -d ./unpacked
          done
          MAIN_FILE=$(find . -path ./.git -prune -o -type f -name TimeStopClockMod.java -print | head -1)
          if [ -z "$MAIN_FILE" ]; then
            echo "ERROR: TimeStopClockMod.java not found in the repository."
            echo "Upload the 'src' folder with all its contents to the repository."
            exit 1
          fi
          SRC_ROOT=$(cd "$(dirname "$MAIN_FILE")/../../../../.." && pwd)
          echo "Mod sources found in: $SRC_ROOT"
          rm -rf "$MDK_DIR/src"
          cp -r "$SRC_ROOT" "$MDK_DIR/src"
          sed -i "s/^mod_id=.*/mod_id=${MOD_ID}/" "$MDK_DIR/gradle.properties"
          sed -i "s/^mod_name=.*/mod_name=Time Stop Clock/" "$MDK_DIR/gradle.properties"
          sed -i "s/^mod_group_id=.*/mod_group_id=com.example.timestopclock/" "$MDK_DIR/gradle.properties"
          sed -i "s/^mod_version=.*/mod_version=1.0.0/" "$MDK_DIR/gradle.properties"
          chmod +x "$MDK_DIR/gradlew"
          cat "$MDK_DIR/gradle.properties"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ env.FORGE_VERSION }}-${{ hashFiles('**/TimeStopClockMod.java') }}
          restore-keys: gradle-${{ env.FORGE_VERSION }}-

      - name: Build
        working-directory: ${{ env.MDK_DIR }}
        run: ./gradlew build --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: timestopclock-jar
          path: ${{ env.MDK_DIR }}/build/libs/*.jar

      - name: Attach jar to release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.MDK_DIR }}/build/libs/*.jar
